name: Deploy CoinPortracker to GitHub Pages # deployment retry
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'app-core.js'
      - 'app-view.js'
      - 'app-actions.js'
      - 'db.js'
      - 'market.js'
      - 'providers.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - 'icon-192.png'
      - 'icon-512.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate application files
        run: |
          node --check db.js
          node --check market.js
          node --check providers.js
          node --check app-core.js
          node --check app-view.js
          node --check app-actions.js
          node --check app.js
          node --check sw.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8'))"
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html styles.css db.js market.js providers.js app-core.js app-view.js app-actions.js app.js manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png dist/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
